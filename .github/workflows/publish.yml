name: Publish
on:
  push:
    tags: ['v*']

# Default to read-only; the publish job elevates to exactly what it needs.
permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub Release
      id-token: write   # required for --provenance (OIDC attestation)
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          scope: '@softspark'

      # A tag can be pushed from a commit that never ran the local gate, so the
      # whole contract is re-checked here rather than trusted.
      - name: Tag matches package.json
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          [ "$PKG" = "$TAG" ] || { echo "::error::package.json is $PKG but the tag is $TAG"; exit 1; }

      - name: Install zsh and shellcheck
        run: sudo apt-get update && sudo apt-get install -y zsh shellcheck

      # Through npm, like CI: the file list lived in three places, and the two
      # that were not package.json both went red on a change that added a file.
      - name: Quality gates
        run: |
          npm run lint
          npm run typecheck
          zsh -n gitspace.plugin.zsh
          zsh -n _gitspace
          npm test

      - name: Tarball gate — everything the plugin needs at runtime ships
        run: |
          tarball="$(npm pack 2>/dev/null | tail -n1)"
          tar -tzf "$tarball" | sed 's#^package/##' > /tmp/pack-entries.txt
          echo "Tarball entries:"; cat /tmp/pack-entries.txt
          missing=0
          for f in gitspace.plugin.zsh _gitspace lib/guard.sh lib/pre-commit lib/pre-push \
                   templates/workspaces.conf bin/gitspace-install.mjs LICENSE NOTICE; do
            grep -qx "$f" /tmp/pack-entries.txt || { echo "::error::missing from tarball: $f"; missing=1; }
          done
          # npm ships LICENSE on its own but never NOTICE; Apache-2.0 §4(d) makes
          # carrying it an obligation, so its absence is a release blocker.
          exit $missing

      # Public npm. Provenance is mandatory here (Golden Rule 8) and works only
      # because the package is published with public access; the private
      # GitHub Packages phase could not carry it. --ignore-scripts costs nothing
      # since the package ships no lifecycle scripts, and closes a supply-chain
      # hole at publish time.
      - name: Publish to npm
        run: npm publish --access public --provenance --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Third-party action pinned to a full commit SHA (supply-chain hardening);
      # Dependabot (github-actions) keeps the SHA current.
      - name: GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
