# gitspace - mapowanie przestrzeni roboczych na tozsamosc.
#
#   nazwa|sciezka|email|konto-gh|alias-ssh[,alias-ssh...]
#
# Przestrzen jest ustalana po SCIEZCE repozytorium (najdluzszy pasujacy prefiks),
# wiec moze lezec gdziekolwiek. Brak wpisu = git odmawia commita. To jest celowe:
# lepiej twardy blad niz commit podpisany cudzym kontem.
#
# Aliasy musza istniec w ~/.ssh/config. Konto gh moze byc puste, gdy przestrzen
# nie korzysta z GitHuba.
#
# Wpisy dodawaj przez:  gitspace add <sciezka> --email <adres> [--gh <konto>] [--alias a,b]
