# gitspace - maps workspace directories to git identities.
#
#   name|path|email|gh-account|ssh-alias[,ssh-alias...]|[sign]
#
# The workspace is resolved by repository PATH (longest matching prefix), so it
# may live anywhere. No entry means git refuses to commit. That is deliberate:
# a hard error beats a commit signed with somebody else's account.
#
# Aliases must exist in ~/.ssh/config. The gh-account field may be empty for
# workspaces that do not use GitHub. The sixth field is "sign" when commits in
# this workspace are signed with its SSH key; absent means signing is off, so
# rows written before signing existed keep working unchanged.
#
# Add entries with:
#   gitspace add <path> --email <address> [--gh <account>] [--alias a,b]
